<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="si-token" content="{{TOKEN}}">
<title>Ambysto Steady</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mini.css">
</head>
<body>
<!-- The floating monitor (app/desktop.py opens it frameless, always on top). Two forms of one
     page: a one-line bar (html[data-mode=bar]: Optimize, download, upload, ping) and the full table
     (speed of the Internet path, ping, apps with open connections, the connection's basic facts).
     Rendered by js/mini.js; text from app/locales. Same CSP as index.html: no inline script. -->
<div class="minibar pywebview-drag-region">
  <!-- Optimize: an icon in a ring. The ring fills with the check's progress; the text is in title/aria-label. -->
  <button class="optimize" id="optimize" aria-label="Optimize">
    <svg class="ring" viewBox="0 0 32 32" aria-hidden="true"><circle class="track" cx="16" cy="16" r="14.25"/>
      <circle class="fill" id="optimize-ring" cx="16" cy="16" r="14.25" pathLength="100"/></svg>
    <svg class="icon glyph" id="optimize-glyph" aria-hidden="true"><use href="#i-bolt"/></svg>
    <span class="badge" id="optimize-badge" hidden></span>
  </button>
  <span class="dot info" id="bar-dot"></span>
  <span class="stat"><svg class="icon down"><use href="#i-down"/></svg><span id="bar-down">—</span></span>
  <span class="stat"><svg class="icon up"><use href="#i-up"/></svg><span id="bar-up">—</span></span>
  <span class="stat"><svg class="icon ping"><use href="#i-pulse"/></svg><span id="bar-ping">—</span></span>
  <canvas id="bar-sweep" aria-hidden="true"></canvas>
  <button class="close" id="expand"><svg class="icon"><use href="#i-expand"/></svg></button>
  <button class="close" id="bar-close" hidden><svg class="icon"><use href="#i-x"/></svg></button>
</div>

<div class="mini">
  <header class="bar pywebview-drag-region">
    <span class="dot info" id="state-dot"></span>
    <span class="name pywebview-drag-region" data-t="app.name">Ambysto Steady</span>
    <span class="state pywebview-drag-region" id="state-text"></span>
    <button class="close" id="collapse"><svg class="icon"><use href="#i-collapse"/></svg></button>
    <button class="close" id="appearance" aria-expanded="false" aria-controls="options"><svg class="icon"><use href="#i-sun"/></svg></button>
    <button class="close" id="close" hidden><svg class="icon"><use href="#i-x"/></svg></button>
  </header>

  <div class="options" id="options" hidden>
    <div class="option">
      <span class="label" data-t="ui.mini.appearance">Appearance</span>
      <div class="segmented" id="theme-choice">
        <button data-theme-value="system" data-t="ui.mini.theme.system">Auto</button>
        <button data-theme-value="light" data-t="ui.settings.theme.light">Light</button>
        <button data-theme-value="dark" data-t="ui.settings.theme.dark">Dark</button>
      </div>
    </div>
    <div class="option" id="transparency-row" hidden>
      <span class="label" data-t="ui.mini.transparency">Transparency</span>
      <div class="segmented" id="transparency-choice">
        <button data-level="off" data-t="ui.mini.transparency.off">Off</button>
        <button data-level="low" data-t="ui.mini.transparency.low">Low</button>
        <button data-level="high" data-t="ui.mini.transparency.high">High</button>
      </div>
    </div>
  </div>

  <div class="tiles" role="tablist">
    <button class="tile" role="tab" data-metric="down" aria-selected="true">
      <span class="label"><svg class="icon"><use href="#i-down"/></svg><span data-t="ui.mini.download">Download</span></span>
      <span class="value" id="value-down">—</span>
    </button>
    <button class="tile" role="tab" data-metric="up" aria-selected="false">
      <span class="label"><svg class="icon"><use href="#i-up"/></svg><span data-t="ui.mini.upload">Upload</span></span>
      <span class="value" id="value-up">—</span>
    </button>
    <button class="tile" role="tab" data-metric="ping" aria-selected="false">
      <span class="label"><svg class="icon"><use href="#i-pulse"/></svg><span data-t="ui.mini.ping">Ping</span></span>
      <span class="value" id="value-ping">—</span>
    </button>
  </div>

  <div class="scope">
    <canvas id="sweep" role="img"></canvas>
    <span class="scale" id="scale"></span>
  </div>

  <div class="switcher">
    <div class="segmented">
      <button data-tab="apps" aria-pressed="true" data-t="ui.mini.tab.apps">Apps</button>
      <button data-tab="network" aria-pressed="false" data-t="ui.mini.tab.network">Network</button>
    </div>
  </div>

  <section class="panel" id="panel-apps">
    <div class="list" id="apps"></div>
    <p class="note" data-t="ui.mini.apps.note"></p>
  </section>
  <section class="panel" id="panel-network" hidden>
    <div class="list" id="network"></div>
  </section>
</div>

<!-- Icons: simple strokes in the style of Lucide (MIT) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v15M6 13l6 6 6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.5-4.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h5l2-5 4 10 2-5h7"/></symbol>
</svg>

<script type="module" src="js/mini.js"></script>
</body>
</html>
